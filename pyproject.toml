[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mynewapp"
version = "0.1.0"
description = "Project Builder Intelligent — Desktop app for automated project scaffolding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "domlemay", email = "domlemay@gmail.com" }]
keywords = ["project-builder", "scaffolding", "developer-tools", "pyqt6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "PyQt6>=6.6.0",
    "PyGithub>=2.1.1",
    "gitpython>=3.1.40",
    "keyring>=24.3.0",
    "jinja2>=3.1.3",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "anthropic>=0.23.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "platformdirs>=4.2.0",
    "packaging>=23.2",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.1.0",
    "cryptography>=41.0.0",
    "msal>=1.26.0",
    "PyJWT>=2.8.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.3.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
mynewapp = "mynewapp.main:main"

[project.gui-scripts]
mynewapp-gui = "mynewapp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mynewapp"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mynewapp"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/mynewapp --cov-report=term-missing -v"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/mynewapp"]
omit = ["*/__init__.py"]
